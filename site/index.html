<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Los Santos → Los Angeles | Interaktywna mapa</title>

  <!-- Leaflet: biblioteka do map interaktywnych -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1>Los Santos <span>→</span> Los Angeles</h1>
      <p>Prawdziwe miejsca, które zainspirowały mapę GTA&nbsp;V</p>
    </header>

    <input id="search" type="search" placeholder="Szukaj miejsca…" autocomplete="off" />

    <div id="filters"></div>

    <ul id="place-list"></ul>

    <footer>
      Projekt fanowski, niezwiązany z Rockstar Games.<br />
      Podkład mapy: Google / Esri / OpenStreetMap (przełącznik w prawym górnym rogu)
    </footer>
  </aside>

  <main id="map"></main>

  <!-- Powiększone zdjęcie (pokazywane po kliknięciu miniatury) -->
  <div id="lightbox" hidden><img alt="Powiększone zdjęcie" /></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Wtyczka pozwalająca wyświetlić mapę Google wewnątrz Leaflet -->
  <script src="https://unpkg.com/leaflet.gridlayer.googlemutant@0.16.0/dist/Leaflet.GoogleMutant.js"></script>
  <!-- Konfiguracja (klucz Google) generowana przez kontener -->
  <script src="config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
